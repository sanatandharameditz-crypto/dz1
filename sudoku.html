<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku · DuelZone</title>
  <meta name="description" content="Play Sudoku on DuelZone — 9x9 Logic Puzzle with virtual keypad, timer, and difficulty modes." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="duelzone.css" />
  <style>
    .hidden { display: none !important; }

    /* ── Sudoku Setup ── */
    .dz-setup-page .dz-setup-wrap {
      display: flex; flex-direction: column; gap: 14px;
      width: 100%; max-width: 400px; margin: 0 auto; padding: 16px;
      font-family: 'Plus Jakarta Sans', sans-serif; color: var(--dz-text-primary);
    }
    .dz-hero-heading {
      font-size: 28px; font-weight: 800;
      background: var(--dz-gradient-text);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 2px;
    }
    .dz-section-title {
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1px; color: var(--dz-text-secondary);
    }
    .dz-mode-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .dz-mode-card {
      background: var(--dz-bg-card); border: 2px solid var(--dz-border);
      border-radius: var(--dz-radius-md); padding: 14px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; transition: all var(--dz-transition); text-align: center;
    }
    .dz-mode-card:hover { border-color: var(--dz-border-light); transform: translateY(-2px); }
    .dz-mode-card.selected { border-color: var(--dz-cyan); box-shadow: 0 0 12px rgba(0,229,255,0.15); }
    .dz-mode-name { font-size: 13px; font-weight: 700; }

    .dz-toggle-row {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 8px; border-bottom: 1.5px solid var(--dz-border);
    }
    .dz-toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
    .dz-toggle input { opacity: 0; width: 0; height: 0; }
    .dz-toggle-track {
      position: absolute; cursor: pointer; inset: 0;
      background-color: var(--dz-border); transition: .3s; border-radius: 24px;
    }
    .dz-toggle-track:before {
      position: absolute; content: ""; height: 16px; width: 16px;
      left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%;
    }
    .dz-toggle input:checked + .dz-toggle-track { background-color: var(--dz-cyan); }
    .dz-toggle input:checked + .dz-toggle-track:before { transform: translateX(20px); }

    /* ── Sudoku Grid UI ── */
    .sdk-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      width: 100%; max-width: 380px; margin: 0 auto; padding: 8px; user-select: none;
    }
    .sdk-status-bar {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
      background: var(--dz-bg-card); border: 1px solid var(--dz-border);
      padding: 8px 14px; border-radius: var(--dz-radius-md); font-size: 13px; font-weight: 700;
    }
    .sdk-timer { font-family: monospace; font-size: 15px; color: var(--dz-cyan); }

    .sdk-board {
      display: grid; grid-template-columns: repeat(9, 1fr);
      background: #0f172a; border: 3px solid #334155; border-radius: 12px;
      overflow: hidden; width: 100%; aspect-ratio: 1;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .sdk-cell {
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: var(--dz-text-primary);
      border: 1px solid rgba(255,255,255,0.06); cursor: pointer; transition: all 0.15s;
    }
    .sdk-cell.given { background: rgba(255,255,255,0.03); color: #94a3b8; font-weight: 800; }
    .sdk-cell.user { color: var(--dz-cyan); }
    .sdk-cell.error { color: #ef4444; background: rgba(239, 68, 68, 0.2); }
    .sdk-cell.selected { background: rgba(0, 229, 255, 0.25) !important; }
    .sdk-cell.highlight { background: rgba(0, 229, 255, 0.08); }
    /* Thick 3x3 borders */
    .sdk-cell:nth-child(3n) { border-right: 2px solid #475569; }
    .sdk-cell:nth-child(9n) { border-right: none; }
    .sdk-cell-row-3, .sdk-cell-row-6 { border-bottom: 2px solid #475569; }

    .sdk-numpad {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; margin-top: 4px;
    }
    .sdk-num-btn {
      background: var(--dz-bg-card); border: 1px solid var(--dz-border);
      border-radius: var(--dz-radius-md); padding: 12px 0; font-size: 16px; font-weight: 800;
      color: var(--dz-text-primary); cursor: pointer; transition: all 0.15s;
    }
    .sdk-num-btn:hover { border-color: var(--dz-cyan); color: var(--dz-cyan); transform: translateY(-2px); }
  </style>
</head>

<script>
/* DuelZone — theme persistence via localStorage */
(function (global) {
  'use strict';

  var STORAGE_KEY = 'dz-theme';

  function getTheme() {
    try {
      return localStorage.getItem(STORAGE_KEY) || 'dark';
    } catch (e) {
      return 'dark';
    }
  }

  function setTheme(theme) {
    var t = theme === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    try {
      localStorage.setItem(STORAGE_KEY, t);
    } catch (e) { /* private browsing */ }
    syncToggleIcons(t);
    return t;
  }

  function syncToggleIcons(theme) {
    var moon = document.getElementById('iconMoon');
    var sun = document.getElementById('iconSun');
    if (!moon || !sun) return;
    var isLight = theme === 'light';
    moon.style.display = isLight ? 'block' : 'none';
    sun.style.display = isLight ? 'none' : 'block';
  }

  function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    return setTheme(current === 'light' ? 'dark' : 'light');
  }

  function bindThemeToggle(btnId) {
    var btn = document.getElementById(btnId || 'themeToggle');
    if (!btn || btn._dzThemeWired) return;
    btn._dzThemeWired = true;
    btn.addEventListener('click', toggleTheme);
  }

  setTheme(getTheme());

  global.dzGetTheme = getTheme;
  global.dzSetTheme = setTheme;
  global.dzToggleTheme = toggleTheme;
  global.dzBindThemeToggle = bindThemeToggle;
  global.dzSyncThemeIcons = function () { syncToggleIcons(getTheme()); };

  document.addEventListener('DOMContentLoaded', function () {
    syncToggleIcons(getTheme());
    bindThemeToggle('themeToggle');
  });
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/* DuelZone — Core Logic, Player Profile, and Global Audio */
(function (global) {
  'use strict';

  // --- GAME LIFECYCLE ---
  var gameLoops = [];
  function registerGameLoop(fn) { gameLoops.push(fn); }
  function unregisterGameLoop(fn) { gameLoops = gameLoops.filter(function (f) { return f !== fn; }); }
  function stopAllGames() {
    gameLoops.forEach(function (fn) { try { fn(); } catch (e) {} });
    gameLoops = [];
  }

  // --- PLAYER PROFILE & XP SYSTEM ---
  var DZPlayer = {
    data: {
      name: "Player",
      avatar: "👽",
      xp: 0,
      level: 1,
      matches: 0,
      wins: 0,
      prefs: { music: false, sfx: true }
    },
    load: function() {
      try {
        var d = localStorage.getItem('dz_player_v1');
        if (d) {
          var parsed = JSON.parse(d);
          for (var k in parsed) {
            if (parsed.hasOwnProperty(k)) this.data[k] = parsed[k];
          }
        }
      } catch(e) {}
      this.recalcLevel();
    },
    save: function() {
      try { localStorage.setItem('dz_player_v1', JSON.stringify(this.data)); } catch(e) {}
    },
    recalcLevel: function() {
      this.data.level = Math.floor(Math.pow(this.data.xp / 100, 0.5)) + 1;
    },
    addXP: function(amount) {
      var oldLevel = this.data.level;
      this.data.xp += amount;
      this.recalcLevel();
      this.save();
      if (this.data.level > oldLevel) {
        if (typeof DZAudio !== 'undefined') DZAudio.playSFX('levelup');
        if (typeof dzFireConfetti === 'function') dzFireConfetti();
      }
    },
    addMatch: function(won) {
      this.data.matches++;
      if (won) this.data.wins++;
      this.save();
    },
    setName: function(newName) {
      if (newName && newName.trim().length > 0) {
        this.data.name = newName.trim().substring(0, 15); // limit length
        this.save();
      }
    },
    xpForNextLevel: function() {
      return Math.pow(this.data.level, 2) * 100;
    },
    xpForCurrentLevel: function() {
      return Math.pow(this.data.level - 1, 2) * 100;
    },
    getProgressPercent: function() {
      var currentFloor = this.xpForCurrentLevel();
      var nextCeil = this.xpForNextLevel();
      var range = nextCeil - currentFloor;
      var into = this.data.xp - currentFloor;
      return Math.min(100, Math.max(0, (into / range) * 100));
    }
  };
  DZPlayer.load();

  // --- GLOBAL AUDIO GENERATOR ---
  var DZAudio = {
    ctx: null,
    bgmNodes: [],
    initialized: false,
    init: function() {
      if (this.initialized) return;
      if (!this.ctx) {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) this.ctx = new AudioContext();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      this.initialized = true;
      if (DZPlayer.data.prefs.music) this.playBGM();
    },
    playBGM: function() {
      this.stopBGM();
      if (!DZPlayer.data.prefs.music || !this.ctx) return;
      var t = this.ctx.currentTime;
      
      var osc1 = this.ctx.createOscillator();
      var gain1 = this.ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.value = 110.00;
      gain1.gain.setValueAtTime(0, t);
      gain1.gain.linearRampToValueAtTime(0.04, t + 4);
      osc1.connect(gain1); gain1.connect(this.ctx.destination);
      osc1.start(t);
      this.bgmNodes.push({o: osc1, g: gain1});
      
      var osc2 = this.ctx.createOscillator();
      var gain2 = this.ctx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.value = 164.81;
      gain2.gain.setValueAtTime(0, t);
      gain2.gain.linearRampToValueAtTime(0.02, t + 6);
      osc2.connect(gain2); gain2.connect(this.ctx.destination);
      osc2.start(t);
      this.bgmNodes.push({o: osc2, g: gain2});
    },
    stopBGM: function() {
      var t = this.ctx ? this.ctx.currentTime : 0;
      this.bgmNodes.forEach(function(n) {
        try {
          n.g.gain.linearRampToValueAtTime(0, t + 1);
          setTimeout(function() { try { n.o.stop(); } catch(e){} }, 1100);
        } catch(e) {}
      });
      this.bgmNodes = [];
    },
    toggleMusic: function(on) {
      DZPlayer.data.prefs.music = on;
      DZPlayer.save();
      if (on) {
        if (!this.initialized) this.init();
        else this.playBGM();
      } else {
        this.stopBGM();
      }
    },
    toggleSFX: function(on) {
      DZPlayer.data.prefs.sfx = on;
      DZPlayer.save();
    },
    isSFXEnabled: function() {
      return DZPlayer.data.prefs.sfx;
    },
    playSFX: function(type) {
      if (!this.isSFXEnabled() || !this.ctx) return;
      var t = this.ctx.currentTime;
      var osc = this.ctx.createOscillator();
      var gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      
      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(400, t + 0.05);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.start(t);
        osc.stop(t + 0.05);
      } else if (type === 'win') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.setValueAtTime(500, t + 0.1);
        osc.frequency.setValueAtTime(600, t + 0.2);
        osc.frequency.setValueAtTime(800, t + 0.3);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.start(t);
        osc.stop(t + 0.5);
      } else if (type === 'levelup') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.setValueAtTime(554.37, t + 0.15); // C#
        osc.frequency.setValueAtTime(659.25, t + 0.3); // E
        osc.frequency.setValueAtTime(880, t + 0.45); // A
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.8);
        osc.start(t);
        osc.stop(t + 0.8);
      }
    }
  };

  document.addEventListener('click', function _initAudio(e) {
    if (DZPlayer.data.prefs.music) DZAudio.init();
    document.removeEventListener('click', _initAudio);
  }, { once: true });

  // Play SFX on button clicks
  document.addEventListener('click', function(e) {
    if (e.target.closest('button') || e.target.closest('.dz-btn') || e.target.closest('.dz-icon-btn') || e.target.closest('.dz-mode-card') || e.target.closest('.dz-swatch')) {
      if (typeof DZAudio !== 'undefined') DZAudio.playSFX('click');
    }
  });

  global.dzRegisterGameLoop = registerGameLoop;
  global.dzUnregisterGameLoop = unregisterGameLoop;
  global.dzStopAllGames = stopAllGames;
  global.DZPlayer = DZPlayer;
  global.DZAudio = DZAudio;

  // --- GLOBAL CONFETTI VFX ---
  global.dzFireConfetti = function() {
    var count = 100;
    var colors = ['#00e5ff', '#ff007f', '#ffd700', '#10b981', '#a855f7'];
    var particles = [];
    var canvas = document.createElement('canvas');
    canvas.style.position = 'fixed';
    canvas.style.inset = '0';
    canvas.style.width = '100vw';
    canvas.style.height = '100vh';
    canvas.style.pointerEvents = 'none';
    canvas.style.zIndex = '9999';
    document.body.appendChild(canvas);
    
    var ctx = canvas.getContext('2d');
    var w = canvas.width = window.innerWidth;
    var h = canvas.height = window.innerHeight;
    
    for (var i=0; i<count; i++) {
      particles.push({
        x: w / 2, y: h / 2,
        vx: (Math.random() - 0.5) * (w > 600 ? 25 : 15),
        vy: (Math.random() - 0.8) * (h > 600 ? 25 : 15),
        size: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 10
      });
    }
    
    function render() {
      ctx.clearRect(0, 0, w, h);
      var active = false;
      particles.forEach(function(p) {
        p.vy += 0.5; // gravity
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.rotSpeed;
        if (p.y < h + 20) active = true;
        
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        ctx.restore();
      });
      if (active) requestAnimationFrame(render);
      else document.body.removeChild(canvas);
    }
    render();
  };

<script>
(function () {
  'use strict';

  function init(opts) {
    opts = opts || {};
    var container = opts.container || document.body;
    if (!container) return { stop: function () {} };
    var sound = opts.sound !== false;
    var diff = opts.difficulty || 'easy';
    var removeCounts = { easy: 35, medium: 46, hard: 55 };
    var removeCount = removeCounts[diff] || 35;

    container.innerHTML = '';

    var style = document.createElement('style');
    style.textContent = [
      '.sdk-wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:400px;margin:0 auto;user-select:none;font-family:"Plus Jakarta Sans",sans-serif;}',
      '.sdk-hud{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 12px;background:#0f172a;border:1px solid rgba(255,255,255,0.07);border-radius:10px;margin-bottom:10px;font-size:12px;}',
      '.sdk-hud-badge{padding:3px 10px;border-radius:12px;font-weight:800;font-size:10px;letter-spacing:1px;text-transform:uppercase;background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.25);color:#00e5ff;}',
      '.sdk-hud-timer{font-family:"Courier New",monospace;font-size:16px;font-weight:900;color:#f59e0b;text-shadow:0 0 8px #f59e0b;}',
      '.sdk-hud-mistakes{font-size:12px;color:#f87171;font-weight:700;}',
      '.sdk-grid-wrap{background:#060c18;border:2px solid rgba(255,255,255,0.06);border-radius:12px;padding:6px;box-shadow:0 0 30px rgba(0,0,0,0.5);}',
      '.sdk-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;}',
      '.sdk-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;border-radius:3px;cursor:pointer;transition:background 0.12s;background:#0a1220;border:1px solid rgba(255,255,255,0.04);}',
      '.sdk-cell:hover:not(.sdk-given):not(.sdk-correct){background:rgba(0,229,255,0.08);border-color:rgba(0,229,255,0.2);}',
      '.sdk-cell.sdk-selected{background:rgba(0,229,255,0.15)!important;border-color:rgba(0,229,255,0.5)!important;}',
      '.sdk-cell.sdk-highlight{background:rgba(0,229,255,0.05);border-color:rgba(0,229,255,0.1);}',
      '.sdk-cell.sdk-given{color:#94a3b8;cursor:default;}',
      '.sdk-cell.sdk-user{color:#00e5ff;}',
      '.sdk-cell.sdk-error{color:#f87171!important;background:rgba(248,113,113,0.1)!important;}',
      '.sdk-cell.sdk-correct{color:#4ade80;}',
      '.sdk-cell.sdk-boxright{border-right:2px solid rgba(255,255,255,0.2)!important;}',
      '.sdk-cell.sdk-boxbottom{border-bottom:2px solid rgba(255,255,255,0.2)!important;}',
      '.sdk-numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;margin-top:10px;}',
      '.sdk-numkey{padding:10px 0;border-radius:8px;background:#1e293b;border:1px solid rgba(255,255,255,0.08);color:#e2e8f0;font-size:16px;font-weight:800;cursor:pointer;text-align:center;transition:all 0.15s;}',
      '.sdk-numkey:active{background:rgba(0,229,255,0.25);border-color:#00e5ff;color:#00e5ff;}',
      '.sdk-numkey.erase{color:#f87171;background:rgba(248,113,113,0.08);}'
    ].join('');
    document.head.appendChild(style);

    var wrap = document.createElement('div');
    wrap.className = 'sdk-wrap';

    // HUD
    var hud = document.createElement('div');
    hud.className = 'sdk-hud';
    hud.innerHTML =
      '<div class="sdk-hud-badge">' + diff.toUpperCase() + '</div>' +
      '<div class="sdk-hud-timer" id="sdk-timer">0:00</div>' +
      '<div class="sdk-hud-mistakes">❌ <span id="sdk-mistakes">0</span>/3</div>';
    wrap.appendChild(hud);

    var gridWrap = document.createElement('div');
    gridWrap.className = 'sdk-grid-wrap';
    var gridEl = document.createElement('div');
    gridEl.className = 'sdk-grid';
    gridWrap.appendChild(gridEl);
    wrap.appendChild(gridWrap);

    // Numpad
    var numpad = document.createElement('div');
    numpad.className = 'sdk-numpad';
    for (var n = 1; n <= 9; n++) {
      (function(num) {
        var key = document.createElement('div');
        key.className = 'sdk-numkey';
        key.textContent = num;
        key.addEventListener('click', function() { inputNumber(num); });
        numpad.appendChild(key);
      })(n);
    }
    var eraseKey = document.createElement('div');
    eraseKey.className = 'sdk-numkey erase';
    eraseKey.textContent = '⌫';
    eraseKey.addEventListener('click', function() { inputNumber(0); });
    numpad.appendChild(eraseKey);
    wrap.appendChild(numpad);
    container.appendChild(wrap);

    // Sudoku generation
    var solution = [], puzzle = [], board = [];
    var selected = -1, mistakes = 0, timerVal = 0;
    var timerInterval = setInterval(function() {
      timerVal++;
      var m = Math.floor(timerVal / 60), s = timerVal % 60;
      var el = document.getElementById('sdk-timer');
      if (el) el.textContent = m + ':' + (s < 10 ? '0' + s : s);
    }, 1000);

    var audioCtx = null;
    function beep(freq, dur, type) {
      if (!sound) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type || 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.05, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function solveSudoku(grid) {
      for (var i = 0; i < 81; i++) {
        if (grid[i] !== 0) continue;
        var r = Math.floor(i / 9), c = i % 9;
        var nums = [1,2,3,4,5,6,7,8,9].sort(function() { return Math.random()-0.5; });
        for (var ni = 0; ni < nums.length; ni++) {
          var num = nums[ni];
          if (isValid(grid, r, c, num)) {
            grid[i] = num;
            if (solveSudoku(grid)) return true;
            grid[i] = 0;
          }
        }
        return false;
      }
      return true;
    }

    function isValid(grid, r, c, num) {
      for (var i = 0; i < 9; i++) {
        if (grid[r*9+i] === num) return false;
        if (grid[i*9+c] === num) return false;
        var br = 3*Math.floor(r/3)+Math.floor(i/3), bc = 3*Math.floor(c/3)+(i%3);
        if (grid[br*9+bc] === num) return false;
      }
      return true;
    }

    function generatePuzzle() {
      solution = new Array(81).fill(0);
      solveSudoku(solution);
      puzzle = solution.slice();
      // Remove cells
      var indices = Array.from({length:81},function(_,i){return i;}).sort(function(){return Math.random()-0.5;});
      for (var k = 0; k < removeCount; k++) puzzle[indices[k]] = 0;
      board = puzzle.slice();
    }

    function cellRow(idx) { return Math.floor(idx / 9); }
    function cellCol(idx) { return idx % 9; }
    function sameBox(a, b) {
      return Math.floor(cellRow(a)/3) === Math.floor(cellRow(b)/3) &&
             Math.floor(cellCol(a)/3) === Math.floor(cellCol(b)/3);
    }

    function renderGrid() {
      gridEl.innerHTML = '';
      for (var i = 0; i < 81; i++) {
        (function(idx) {
          var el = document.createElement('div');
          el.className = 'sdk-cell';
          var r = cellRow(idx), c = cellCol(idx);
          if (c === 2 || c === 5) el.classList.add('sdk-boxright');
          if (r === 2 || r === 5) el.classList.add('sdk-boxbottom');
          if (puzzle[idx] !== 0) {
            el.classList.add('sdk-given');
            el.textContent = puzzle[idx];
          } else if (board[idx] !== 0) {
            el.textContent = board[idx];
            if (board[idx] === solution[idx]) el.classList.add('sdk-correct');
            else el.classList.add('sdk-error');
          }
          if (selected !== -1) {
            var sr = cellRow(selected), sc = cellCol(selected);
            if (idx === selected) el.classList.add('sdk-selected');
            else if (r === sr || c === sc || sameBox(idx, selected)) el.classList.add('sdk-highlight');
          }
          el.addEventListener('click', function() {
            if (puzzle[idx] !== 0) return;
            selected = idx;
            renderGrid();
          });
          gridEl.appendChild(el);
        })(i);
      }
    }

    function inputNumber(num) {
      if (selected === -1 || puzzle[selected] !== 0) return;
      if (num === 0) {
        board[selected] = 0;
        renderGrid();
        return;
      }
      board[selected] = num;
      beep(num === solution[selected] ? 600 : 200, 0.08, num === solution[selected] ? 'sine' : 'sawtooth');
      if (num !== solution[selected]) {
        mistakes++;
        var me = document.getElementById('sdk-mistakes');
        if (me) me.textContent = mistakes;
        if (mistakes >= 3) {
          clearInterval(timerInterval);
          renderGrid();
          setTimeout(function() {
            if (opts.onEnd) opts.onEnd({ winner: 'Game Over', subtitle: 'Too many mistakes!' });
          }, 800);
          return;
        }
      }
      renderGrid();
      // Check complete
      var complete = true;
      for (var i = 0; i < 81; i++) {
        if (board[i] !== solution[i]) { complete = false; break; }
      }
      if (complete) {
        clearInterval(timerInterval);
        beep(800, 0.5, 'triangle');
        setTimeout(function() {
          if (opts.onEnd) opts.onEnd({ winner: 'Solved!', subtitle: 'Completed in ' + Math.floor(timerVal/60) + ':' + (timerVal%60<10?'0':'') + timerVal%60 });
        }, 600);
      }
    }

    // Keyboard input
    document.addEventListener('keydown', function kh(e) {
      if (!container.isConnected) { document.removeEventListener('keydown', kh); return; }
      if (e.key >= '1' && e.key <= '9') inputNumber(parseInt(e.key));
      if (e.key === 'Backspace' || e.key === 'Delete') inputNumber(0);
    });

    generatePuzzle();
    renderGrid();

    return { stop: function() { clearInterval(timerInterval); } };
  }

  if (!window.DZGames) window.DZGames = {};
  window.DZGames['sudoku'] = init;
})();
</script>
<script>
(function (global) {
  'use strict';

  // Preload QRious
  function loadQRious(cb) {
    if (global.QRious) { if (cb) cb(); return; }
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js';
    s.onload = function() { if (cb) cb(); };
    s.onerror = function() { if (cb) cb(); };
    document.head.appendChild(s);
  }
  loadQRious();

  function _safe(text) {
    if (!text) return '';
    return String(text).replace(/<[^>]*>/g, '').replace(/[\x00-\x1F\x7F]/g, '');
  }

  function _hex2rgba(hex, alpha) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var r = parseInt(h.slice(0, 2), 16);
    var g = parseInt(h.slice(2, 4), 16);
    var b = parseInt(h.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
  }

  function drawGlitchText(ctx, text, x, y, size) {
    ctx.font = '900 ' + size + 'px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // Cyan offset
    ctx.fillStyle = '#00e5ff';
    ctx.fillText(text, x - 4, y - 3);
    // Magenta offset
    ctx.fillStyle = '#f43f5e';
    ctx.fillText(text, x + 4, y + 3);
    // White top
    ctx.fillStyle = '#ffffff';
    ctx.fillText(text, x, y);
  }

  function createShareCard(options) {
    var opts = options || {};
    var w = 540;
    var h = 960; // Vertical format matching user screenshot
    var canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext('2d');

    // Deep Black background
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, w, h);

    // Floating colorful squares with gradients (retro aesthetic)
    var squares = [
      { x: 80, y: 150, size: 80, r: -15, color1: '#f97316', color2: '#fbbf24' },
      { x: 420, y: 220, size: 70, r: 10, color1: '#a855f7', color2: '#ec4899' },
      { x: 120, y: 820, size: 80, r: -20, color1: '#3b82f6', color2: '#00e5ff' },
      { x: 450, y: 780, size: 65, r: 25, color1: '#ec4899', color2: '#f43f5e' },
      { x: 90, y: 550, size: 55, r: 5, color1: '#10b981', color2: '#34d399' },
      { x: 480, y: 480, size: 75, r: -12, color1: '#8b5cf6', color2: '#6366f1' }
    ];

    squares.forEach(function(sq) {
      ctx.save();
      ctx.translate(sq.x, sq.y);
      ctx.rotate(sq.r * Math.PI / 180);
      var grad = ctx.createLinearGradient(0, 0, sq.size, sq.size);
      grad.addColorStop(0, sq.color1);
      grad.addColorStop(1, sq.color2);
      ctx.fillStyle = grad;
      drawRoundedRect(ctx, -sq.size/2, -sq.size/2, sq.size, sq.size, 20);
      ctx.restore();
    });

    // Top Right: Player info (Avatar, Name, Level)
    if (typeof window !== 'undefined' && window.DZPlayer) {
      var pName = (window.DZPlayer.data && window.DZPlayer.data.name) || 'Player';
      var pLevel = 'Lv.' + ((window.DZPlayer.data && window.DZPlayer.data.level) || 1);
      var avatar = (window.DZPlayer.data && window.DZPlayer.data.avatar) || '👽';
      
      ctx.textAlign = 'right';
      ctx.textBaseline = 'top';
      
      // Avatar
      ctx.font = '36px sans-serif';
      ctx.fillText(avatar, w - 30, 40);

      // Name
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px Plus Jakarta Sans, sans-serif';
      ctx.fillText(_safe(pName), w - 85, 35);
      
      // Level
      ctx.fillStyle = '#00e5ff';
      ctx.font = 'bold 16px Plus Jakarta Sans, sans-serif';
      ctx.fillText(_safe(pLevel), w - 85, 65);
    }

    // Main Text (Glitch Retro Style)
    drawGlitchText(ctx, "DUELZONE", w/2, 280, 75);
    drawGlitchText(ctx, _safe((opts.title || "VICTORY").toUpperCase()), w/2, 400, 52);

    if (opts.stats) {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 42px Plus Jakarta Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(_safe(opts.stats), w/2, 510);
    }

    // QR Code (Directly drawn from QRious canvas synchronously)
    if (typeof QRious !== 'undefined') {
      try {
        var gameUrl = window.location.href;
        var qr = new QRious({
          value: gameUrl,
          size: 160,
          background: '#ffffff',
          foreground: '#050505',
          level: 'M'
        });
        
        ctx.fillStyle = '#ffffff';
        drawRoundedRect(ctx, w/2 - 95, 610, 190, 190, 16);
        
        // Draw the QR canvas directly onto the share canvas (100% synchronous)
        ctx.drawImage(qr.canvas, w/2 - 80, 625, 160, 160);
        
        ctx.fillStyle = '#a1a1aa';
        ctx.font = 'bold 16px Plus Jakarta Sans, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("SCAN TO PLAY", w/2, 830);
      } catch (err) {
        console.warn('QR code generation error:', err);
      }
    }

    return canvas;
  }

  function shareWin(options) {
    loadQRious(function () {
      var canvas = createShareCard(options);
      var dataUrl = canvas.toDataURL('image/png');
      if (navigator.share && options.tryNativeShare) {
        canvas.toBlob(function (blob) {
          if (!blob) return downloadDataUrl(dataUrl, 'duelzone-win.png');
          var file = new File([blob], 'duelzone-win.png', { type: 'image/png' });
          navigator.share({ files: [file], title: _safe(options.title || 'DuelZone Win') })
            .catch(function () { downloadDataUrl(dataUrl, 'duelzone-win.png'); });
        });
      } else {
        downloadDataUrl(dataUrl, 'duelzone-win.png');
      }
    });
  }

  function downloadDataUrl(dataUrl, filename) {
    var a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    a.click();
  }

  global.dzShareSafe = _safe;
  global.dzShareHex2Rgba = _hex2rgba;
  global.dzCreateShareCard = createShareCard;
  global.dzShareWin = shareWin;
})(typeof window !== 'undefined' ? window : this);

</script>

<script>
(function() {
  'use strict';
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.dz-mode-card').forEach(function(card) {
      card.addEventListener('click', function() {
        document.querySelectorAll('.dz-mode-card').forEach(function(c) { c.classList.remove('selected'); });
        card.classList.add('selected');
      });
    });

    var setup = document.getElementById('sdk-setup');

    var instance = null;

    document.getElementById('sdk-start-btn').addEventListener('click', function() {
      var diffCard = document.querySelector('.dz-mode-card.selected');
      var diff = diffCard ? diffCard.dataset.diff : 'easy';
      var sound = document.getElementById('sdk-sound-toggle').checked;

      setup.classList.add('hidden');
      play.classList.remove('hidden');
      if (instance && instance.stop) instance.stop();

      setTimeout(function() {
        try {
          if (window.DZGames && window.DZGames['sudoku']) {
        instance = window.DZGames['sudoku']({
          container: area,
          difficulty: diff,
          sound: sound,
          onEnd: function(r) {
            if (typeof dzShowResult === 'function') {
              dzShowResult({
                title: 'Puzzle Solved!',
                subtitle: 'Completed in ' + r.time,
                onAgain: function() {
                  if (typeof dzHideResult === 'function') dzHideResult();
                  play.classList.add('hidden');
                  setup.classList.remove('hidden');
                }
              });
            }
          }
        });
          } else {
            area.innerHTML = '<div style="color:#ff4444; padding:20px; font-family:sans-serif; text-align:center;">Error: Game script not found or failed to load.</div>';
          }
        } catch (err) {
          area.innerHTML = '<div style="color:#ff4444; padding:20px; font-family:sans-serif; text-align:center;">Error: ' + err.message + '</div>';
        }
      }, 60);
    });

    document.getElementById('dz-restart').addEventListener('click', function() {
      if (instance && instance.stop) instance.stop();
      if (typeof dzHideResult === 'function') dzHideResult();
      play.classList.add('hidden');
      setup.classList.remove('hidden');
    });

    if (typeof dzInitGamePage === 'function') dzInitGamePage({});
  });
})();
</script>
</body>
</html>
